name: Refresh lexeme ID lists and deploy dashboard

# What this CAN do from GitHub Actions (public internet only):
#   - Re-fetch current L-id lists per language from the public Wikidata
#     Query Service, and regenerate the Quarry SQL files you paste in
#     manually (or feed to the Toolforge job).
#   - Deploy site/ to GitHub Pages whenever data/lexeme_edits.json changes
#     (e.g. after your Toolforge cron job pushes an update, or you commit
#     a manually-exported CSV/JSON).
#
# What this CANNOT do from GitHub Actions:
#   - Query the Wikidata replica database directly for edit counts.
#     That database is only reachable from Wikimedia Cloud VPS / Toolforge.
#     Use scripts/toolforge_update_stats.py on a Toolforge job for that part,
#     or run the Quarry queries manually and commit the result.

on:
  schedule:
    - cron: '0 4 1 * *'   # monthly, 1st at 04:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'data/lexeme_edits.json'
      - 'site/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-ids:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/get_lexeme_ids.py
      - run: |
          git config user.name "lexeme-stats-bot"
          git config user.email "lexeme-stats-bot@users.noreply.github.com"
          git add data/lexeme_ids queries/generated
          git diff --cached --quiet || git commit -m "Refresh lexeme ID lists"
          git push

  deploy-pages:
    needs: []
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
